name: build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out karpfen IDE with its submodules
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # The default provider, 'enhanced', loads the proprietary gradle-actions-caching component under the
          # Gradle Technologies Terms of Use, and a paid tier is announced for private repositories. 'basic' caches
          # the Gradle User Home with the MIT-licensed actions/cache. Switching means accepting those terms, so it is
          # a deliberate project decision and not a tuning detail.
          cache-provider: basic

      - name: Build
        run: ./gradlew build

      # jpackage rejects some settings only when it runs, for example a 0.x app version on macOS, so CI also builds
      # the app image.
      - name: Package app image
        run: ./gradlew :app:ide:createDistributable
