name: build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out karpfen IDE
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # karpfen-dsl-tools is not published to a Maven repository yet. Cloning it next to this checkout
      # makes settings.gradle.kts include it as a composite build (default dslToolsPath ../karpfen-dsl-tools).
      # This is a temporary deviation from D2/§5.1 ("CI uses published artifacts"), see ADR 0010. The clone is
      # pinned (proposal §8) so that an upstream push cannot break this build; bump the ref deliberately.
      - name: Check out karpfen-dsl-tools (composite build)
        env:
          DSL_TOOLS_REF: 859a95da0541e6c403994d22d38f8c8510720324
        run: |
          git init --quiet ../karpfen-dsl-tools
          git -C ../karpfen-dsl-tools fetch --quiet --depth 1 https://github.com/karpfenproject/karpfen-dsl-tools "$DSL_TOOLS_REF"
          git -C ../karpfen-dsl-tools checkout --quiet --detach FETCH_HEAD

      - name: Build
        run: ./gradlew build

      # jpackage rejects some settings only when it runs (e.g. a 0.x app version on macOS), so build the app image.
      - name: Package app image
        run: ./gradlew :app:ide:createDistributable
