name: build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out karpfen IDE
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # karpfen-dsl-tools is not published to a Maven repository yet. Cloning it next to this checkout
      # makes settings.gradle.kts include it as a composite build (default dslToolsPath ../karpfen-dsl-tools).
      - name: Check out karpfen-dsl-tools (composite build)
        run: git clone --depth 1 https://github.com/karpfenproject/karpfen-dsl-tools ../karpfen-dsl-tools

      - name: Build
        run: ./gradlew build
